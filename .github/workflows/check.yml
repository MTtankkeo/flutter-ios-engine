name: Check release patch
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts
        run: python3 -m compileall -q scripts
      - name: Test release selection and build artifacts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Apply patch to configured official release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/engine.py check
