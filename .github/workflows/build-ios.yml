name: Build and release iOS engine
on:
  push:
    branches: [main]
    paths:
      - build-config.json
      - patches/**
  workflow_dispatch:
    inputs:
      channel:
        description: Flutter release channel
        type: choice
        options:
          - stable
          - beta
        default: stable
        required: true
      flutter_version:
        description: Exact Flutter version (beta requires its full .pre version)
        type: string
        default: '3.47.6'
        required: true
      publish:
        description: Publish a GitHub Release after the smoke build succeeds
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ios-engine-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      DEPOT_TOOLS_UPDATE: '0'
      FLUTTER_CHANNEL: ${{ inputs.channel || '' }}
      FLUTTER_VERSION: ${{ inputs.flutter_version || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate build scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Install depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"
      - name: Prepare selected release and apply patch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/engine.py prepare
      - name: Build iOS and matching host engine
        run: python3 scripts/engine.py build
      - name: Package runtime artifacts and free build objects
        run: python3 scripts/engine.py package
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-ios-engine
          path: dist/*
          compression-level: 0
          if-no-files-found: error
      - name: Build unsigned smoke app with packaged engine
        run: python3 scripts/engine.py smoke
      - name: Publish immutable release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(python3 scripts/engine.py release-tag)
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --notes-file RELEASE-NOTES.md
